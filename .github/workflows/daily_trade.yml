name: Daily Automated Swing Trader

on:
  schedule:
    # 23:30 שעון ישראל (UTC+3) = 20:30 UTC
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  run-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Scan and Execution
        run: python run_daily.py

      - name: Commit & Push updated portfolio.db
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.db
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update portfolio.db after daily scan [skip ci]"
          git push
