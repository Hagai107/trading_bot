name: Daily Automated Swing Trader

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests lxml html5lib

      - name: Run Daily Scan and Execution
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily.py

      - name: Commit and Push DB Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.db
          git diff-index --quiet HEAD || (git commit -m "Auto-update portfolio.db after daily scan [skip ci]" && git push)