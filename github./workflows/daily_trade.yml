name: Daily Automated Swing Trader

on:
  schedule:
    # 23:30 שעון ישראל בקיץ (IDT, UTC+3) מקביל ל-20:30 UTC
    # בחורף (IST, UTC+2) יש לשנות ל- '30 21 * * *'
    - cron: '30 20 * * *'
    
  # מאפשר לך להפעיל את הבוט ידנית בכל רגע דרך האתר של GitHub
  workflow_dispatch:

jobs:
  run-trader:
    runs-on: ubuntu-latest

    steps:
      # 1. הורדת הקוד מה-Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. התקנת Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. התקנת ספריית הדרישות
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. הרצת סקריפט המסחר היומי
      - name: Run Daily Scan and Execution
        run: python run_daily.py

      # 5. שמירה ודחיפה של portfolio.db המעודכן חזרה ל-GitHub
      - name: Commit & Push updated portfolio.db
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.db
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update portfolio.db after daily scan [skip ci]"
          git push